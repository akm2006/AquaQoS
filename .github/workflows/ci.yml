name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.10.0
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile contracts
        run: pnpm build
      - name: Run Solidity tests
        run: pnpm test
      - name: Check capacity model
        run: node scripts/check-capacity-model.mjs
      - name: Check benchmark evidence
        run: pnpm check:benchmark && node scripts/check-benchmark.test.mjs
      - name: Check rejection evidence
        run: node scripts/check-rejections.mjs --self-test
      - name: Check release evidence
        run: node scripts/check-release-evidence.mjs --self-test
      - name: Check repository bootstrap
        run: pnpm check:bootstrap

  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.10.0
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check
        run: pnpm typecheck
      - name: Build production application
        run: pnpm build
