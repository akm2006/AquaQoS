name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Protocol, evidence, and web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile contracts
        run: pnpm build
      - name: Run Solidity tests
        run: pnpm test
      - name: Check capacity model
        run: node scripts/check-capacity-model.mjs
      - name: Check benchmark evidence
        run: pnpm check:benchmark && node scripts/check-benchmark.test.mjs
      - name: Check rejection evidence
        run: node scripts/check-rejections.mjs --self-test
      - name: Check release evidence
        run: node scripts/check-release-evidence.mjs --self-test
      - name: Check repository bootstrap
        run: pnpm check:bootstrap
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check
        working-directory: web
        run: pnpm typecheck
      - name: Build production application
        working-directory: web
        run: pnpm build
