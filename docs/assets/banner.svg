<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="AquaQoS — Shared liquidity, scheduled.">
  <title>AquaQoS — Shared liquidity, scheduled.</title>
  <!-- Brutalist product surface: cream ground, 24px dot grid, 2px ink frames (web/app/(site)/globals.css).
       The mark is the unchanged master geometry from AquaQoS.svg, placed on the approved
       near-black surface #070707 (DESIGN.md 6.3) so its white fill keeps contrast. -->
  <defs>
    <pattern id="aq-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#C4C2B8"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#F1EFE9"/>
